[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "junior-engineer-bot"
version = "0.1.0"
description = "Autonomous Junior Engineering Agent: CI log parser, deterministic and LLM-based fixers, sandboxed verification, and PR creation."
authors = [{ name = "SelfSmart Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "anthropic>=0.18.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
junior-engineer-bot = "app.cli:cli"
