[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelx-platform"
version = "1.0.0"
description = "Autonomous agent platform with terminal and voice interfaces"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "ModelX Team", email = "voice@modelx.ai"}
]
maintainers = [
    {name = "ModelX Team", email = "voice@modelx.ai"}
]
keywords = [
    "voice-assistant",
    "tts",
    "stt",
    "llm",
    "terminal",
    "piper",
    "whisper",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9.0",
    "alembic>=1.14.0",
    "anthropic>=0.18.0",
    "apscheduler>=3.10.0",
    "arxiv>=2.1.0",
    "asyncpg>=0.30.0",
    "click>=8.1.0",
    "edge-tts>=7.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "keyring>=24.0.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "neo4j>=5.24.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "opencv-python>=4.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.0.0",
    "playwright>=1.40.0",
    "prometheus-client>=0.20.0",
    "prompt-toolkit>=3.0.0",
    "psutil>=6.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.0",
    "qdrant-client>=1.12.0",
    "redis>=5.0.0",
    "rich>=13.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.5.0",
    "sounddevice>=0.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.0.0",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "textual>=0.80.0",
    "tiktoken>=0.8.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "uuid6>=2024.1.0",
    "uvicorn[standard]>=0.32.0",
    "wikipedia-api>=0.7.0",
    "piper-tts>=1.2.0",
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
]

[project.scripts]
modelx-voice = "modelx_voice.main:main"
modelx = "src.cli.main:cli"
modelx-api = "src.api.cli:main"
modelx-execution-harness = "src.cli.execution_loop_harness:cli"

[project.optional-dependencies]
audio = ["pyaudio>=0.2.13"]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bump2version>=1.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/modelx/modelx-voice"
Repository = "https://github.com/modelx/modelx-voice"
Issues = "https://github.com/modelx/modelx-voice/issues"
Documentation = "https://github.com/modelx/modelx-voice#readme"
Changelog = "https://github.com/modelx/modelx-voice/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["modelx_voice", "src"]
include = ["modelx_voice/voices/*.onnx", "modelx_voice/voices/*.json"]

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["modelx_voice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.mypy."modelx_voice.*"]
ignore_missing_imports = true

[tool.mypy."src.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-k", "not audio",  # Skip audio tests by default
]
markers = [
    "audio: marks tests as requiring audio hardware",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["modelx_voice"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

[tool.pre-commit]
exclude = "^docs/"

[tool.bumpversion]
current_version = "1.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = "{major}.{minor}.{patch}"
commit = true
tag = true
message = "chore: release v{new_version}"

[tool.bumpversion.file_patterns]
files = [
    "pyproject.toml",
    "modelx_voice/__init__.py",
]
