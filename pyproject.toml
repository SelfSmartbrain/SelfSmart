[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfsmart"
version = "1.0.0"
description = "SelfSmart AI — Intelligent Self-Learning Chatbot & Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "SelfSmart Team", email = "team@selfsmart.ai"}
]
maintainers = [
    {name = "SelfSmart Team", email = "team@selfsmart.ai"}
]
keywords = [
    "chatbot",
    "llm",
    "rag",
    "self-learning",
    "fastapi",
    "nextjs",
    "qdrant",
    "postgresql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Core FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    # HTTP clients
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    # AI/LLM
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "transformers>=4.36.0",
    "huggingface-hub>=0.19.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "sentence-transformers>=2.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.0.1",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mlx-lm>=0.29.1",
    # Vector database & embeddings
    "qdrant-client>=1.12.0",
    "chromadb>=0.4.18",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    # Monitoring & Logging
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
    "sentry-sdk>=1.38.0",
    # Web scraping & data processing
    "selenium>=4.16.0",
    "playwright>=1.40.0",
    "fake-useragent>=1.4.0",
    "beautifulsoup4>=4.12.2",
    "trafilatura>=1.12.0",
    "newspaper4k>=0.9.3",
    "aiofiles>=23.2.1",
    "aiolimiter>=1.1.0",
    "feedparser>=6.0.10",
    "wikipedia-api>=0.7.0",
    "youtube-transcript-api>=0.6.2",
    "langdetect>=1.0.9",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Graph database
    "neo4j>=5.24.0",
    "networkx>=3.2.0",
    # Distributed tasks
    "celery>=5.3.0",
    "flower>=2.0.0",
    "tenacity>=9.0.0",
    # Utilities
    "click>=8.1.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "psutil>=6.0.0",
    "schedule>=1.2.0",
    "textblob>=0.17.1",
    "spacy>=3.7.0",
    "tiktoken>=0.8.0",
    "uuid6>=2024.1.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "apscheduler>=3.10.0",
    "arxiv>=2.1.0",
    "keyring>=24.0.0",
    "opencv-python>=4.8.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "edge-tts>=7.0.0",
    "piper-tts>=1.2.0",
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
    "sounddevice>=0.4.0",
    # Rate limiting
    "aiolimiter>=1.1.0",
    # Scientific computing
    "scipy>=1.11.0",
    "peft>=0.19.1",
    "trl>=1.9.1",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
voice = [
    "pyaudio>=0.2.13",
]
training = [
    "peft>=0.6.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.24.0",
    "trl>=0.7.0",
    "tensorboard>=2.14.0",
    "wandb>=0.16.0",
    "datasets>=2.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bump2version>=1.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
selfsmart = "src.cli.main:cli"
selfsmart-api = "src.api.cli:main"
selfsmart-execution-harness = "src.cli.execution_loop_harness:cli"
modelx-voice = "modelx_voice.main:main"

[project.urls]
Homepage = "https://github.com/selfsmart/selfsmart"
Repository = "https://github.com/selfsmart/selfsmart"
Issues = "https://github.com/selfsmart/selfsmart/issues"
Documentation = "https://github.com/selfsmart/selfsmart#readme"

[tool.hatch.build.targets.wheel]
packages = ["src", "modelx_voice"]
include = ["modelx_voice/voices/*.onnx", "modelx_voice/voices/*.json"]

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "modelx_voice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.mypy."modelx_voice.*"]
ignore_missing_imports = true

[tool.mypy."src.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-k", "not audio",  # Skip audio tests by default
]
markers = [
    "audio: marks tests as requiring audio hardware",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src", "modelx_voice"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "src/web_server.py",  # archived monolith
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

[tool.pre-commit]
exclude = "^docs/"

[tool.bumpversion]
current_version = "1.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = "{major}.{minor}.{patch}"
commit = true
tag = true
message = "chore: release v{new_version}"

[tool.bumpversion.file_patterns]
files = [
    "pyproject.toml",
    "src/__init__.py",
]
