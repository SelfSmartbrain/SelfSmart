apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartself-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartself-backend
  template:
    metadata:
      labels:
        app: smartself-backend
    spec:
      containers:
      - name: backend
        image: smartself-ai:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: smartself-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: smartself-secrets
              key: redis_url
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: smartself-service
spec:
  selector:
    app: smartself-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
